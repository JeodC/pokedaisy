# Publishes a GitHub release with the signed APK when a v<versionName> tag is pushed
# (`make release` does that from an up-to-date main). Nothing is published unless:
#   - the tag is on main and matches versionName in app/build.gradle.kts,
#   - the whole CI suite passes on the tagged commit (main's own CI run on it, when that passed; else run again here),
#   - the ROM-backed tests pass on the self-hosted ROM runner (once ROM_RUNNER is on),
#   - the APK is signed with the release key (its certificate matches RELEASE_CERT_SHA256),
#   - the APK holds the native code for both arm64 and 32-bit ARM (one APK for every device).
# Then the other platforms go onto the draft from the same tag: the 3DS app and CIA (3ds.yml), the Windows zip
# (windows.yml) and the six Linux zips (linux.yml, its tests included).
# Setup (secrets, variables, the runner, branch protection): docs/RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Tag is on main and matches versionName
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      ci_green: ${{ steps.ci.outputs.green }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          if [ "v${version}" != "${tag}" ]; then
            echo "::error::tag ${tag} doesn't match versionName ${version}"; exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${tag} isn't on main - release from main only"; exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # 1.2.0-rc.1 and the like go out as pre-releases, which the in-app updater offers only with BETA UPDATES on.
          if [[ "${version}" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      # The tag sits on a main commit, and every push to main runs ci.yml on it: when that run passed, the same suite on
      # the same commit needn't run again (about 25 minutes). No such run, or one that didn't pass: `checks` runs CI.
      - id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&branch=main&event=push&status=success&per_page=5" \
            --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .conclusion == "success")] | length' || echo 0)"
          if [ "${runs:-0}" -gt 0 ]; then
            echo "green=true" >> "$GITHUB_OUTPUT"
            echo "::notice::main's CI already passed on ${GITHUB_SHA}: not running it again"
          else
            echo "green=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no passed CI run on main for ${GITHUB_SHA}: running CI here"
          fi

  checks:
    name: CI
    needs: verify
    if: needs.verify.outputs.ci_green != 'true'
    uses: ./.github/workflows/ci.yml

  rom-tests:
    name: ROM-backed tests
    needs: verify
    # The player's own ROM dumps can't live in this public repo or on GitHub's runners:
    # this runs on a self-hosted runner that has them (docs/RELEASING.md). Until the
    # ROM_RUNNER variable is 'true' it's skipped, and the release says so.
    if: vars.ROM_RUNNER == 'true'
    runs-on: [self-hosted, pokedaisy-roms]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Without n3ds, as CI: the optional Azahar tree (and its unrelated Android wrappers) stays out.
      - name: Native dependencies (default features)
        run: git -c submodule.third_party/azahar.update=none submodule update --init --recursive
      - name: Unit tests with ROMs
        # POKEDAISY_ROM_DIR is set in the runner's own environment (its .env file).
        run: |
          test -n "${POKEDAISY_ROM_DIR}" || { echo "::error::POKEDAISY_ROM_DIR isn't set on this runner"; exit 1; }
          test -d "${POKEDAISY_ROM_DIR}" || { echo "::error::${POKEDAISY_ROM_DIR} doesn't exist"; exit 1; }
          ./gradlew :app:testDebugUnitTest :shared:testDebugUnitTest --stacktrace
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rom-test-reports
          path: |
            app/build/reports/tests/
            shared/build/reports/tests/
          retention-days: 7

  publish:
    name: Build, sign and draft
    needs: [verify, checks, rom-tests]
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.checks.result == 'success' || (needs.checks.result == 'skipped' && needs.verify.outputs.ci_green == 'true')) &&
      (needs.rom-tests.result == 'success' || needs.rom-tests.result == 'skipped')
    runs-on: ubuntu-latest
    # Holds the signing / Firebase secrets; can also require a manual approval.
    environment: release
    permissions:
      contents: write
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      # What app/build.gradle.kts reads from outside the repo: ScreenScraper's developer credentials
      # (ScreenScraperClient) and the co-op relay (BuildConfig.COOP_RELAY_URL).
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
      COOP_RELAY_URL: ${{ secrets.COOP_RELAY_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Signing key + Firebase config (from secrets, never committed)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!v}" || { echo "::error::secret ${v} isn't set (docs/RELEASING.md)"; exit 1; }
          done
          echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
          {
            echo "storeFile=${RUNNER_TEMP}/release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties
          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            printf '%s' "${GOOGLE_SERVICES_JSON}" > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON isn't set: this release can't send crash reports"
          fi
          if [ -z "${SCREENSCRAPER_DEV_ID}" ]; then
            echo "::warning::SCREENSCRAPER_DEV_ID isn't set: ScreenScraper may refuse this release's calls"
          fi
          if [ -z "${COOP_RELAY_URL}" ]; then
            echo "::notice::COOP_RELAY_URL isn't set: this release's co-op works on the same Wi-Fi and BY IP only"
          fi

      # The submodules, the toolchain, assembleRelease for both ABIs and the ABI check: the same action the Nightly's
      # dry run builds with (unsigned), so a release never meets a build problem first.
      - id: build
        uses: ./.github/actions/release-build

      - name: Signed with the release key
        env:
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
          APK: ${{ steps.build.outputs.apk }}
        run: |
          [ "$(basename "${APK}")" = app-release.apk ] || { echo "::error::the release APK came out unsigned (${APK})"; exit 1; }
          apksigner="$(ls -d "${ANDROID_HOME}"/build-tools/*/ | sort -V | tail -1)apksigner"
          certs="$("${apksigner}" verify --print-certs "${APK}")"
          echo "${certs}"
          # The in-app updater only installs over the same key: a release signed with any
          # other would strand every user on the old version.
          if [ -n "${RELEASE_CERT_SHA256}" ]; then
            want="$(echo "${RELEASE_CERT_SHA256}" | tr -d ':' | tr 'A-F' 'a-f')"
            echo "${certs}" | grep -qi "SHA-256 digest: ${want}" || { echo "::error::APK isn't signed with the release key"; exit 1; }
          else
            echo "::warning::RELEASE_CERT_SHA256 isn't set: the signing key wasn't checked"
          fi
          mkdir -p dist
          cp "${APK}" "dist/PokeDaisy-${VERSION}.apk"

      - name: Native symbols to Crashlytics
        if: hashFiles('app/google-services.json') != ''
        run: ./gradlew :app:uploadCrashlyticsSymbolFileRelease --stacktrace

      # Every release goes up as a draft and stays one: the owner reads it, adds the notes and any other
      # platform's files (Linux, 3DS), and publishes it (docs/RELEASING.md). Releases are immutable once
      # published, so nothing can be added after. Publishing the draft with the owner's own token fires
      # website.yml's `released` trigger (a full release only), which puts the site live with it.
      - name: Put up the draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: PokeDaisy ${{ env.VERSION }}
          files: dist/PokeDaisy-${{ env.VERSION }}.apk
          generate_release_notes: true
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          draft: true
          body: |
            ${{ needs.rom-tests.result == 'skipped' && '> Released without the ROM-backed tests (no ROM runner configured).' || '' }}

      - name: Clean up the key
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks" keystore.properties app/google-services.json

  # The 3DS app onto the draft: pokedaisy.3dsx, pokedaisy.cia and the CIA's QR code (in the notes too), built from the tag.
  threeds:
    name: 3DS app and CIA
    needs: publish
    # always(): a skipped job anywhere above (rom-tests without a ROM runner, checks after main's green CI) would
    # otherwise skip this one too, as it did for 1.6.2-beta.2.
    if: always() && needs.publish.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/3ds.yml
    with:
      tag: ${{ github.ref_name }}
      upload_3dsx: true

  # The Windows zip onto the draft (windows/package.sh's PokeDaisy-<version>-windows-x86_64.zip), built from the tag.
  windows:
    name: Windows zip
    needs: publish
    if: always() && needs.publish.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/windows.yml
    with:
      tag: ${{ github.ref_name }}

  # The Linux suite on the tag (tests included) and its six zips onto the draft: the Steam Deck / PC, TrimUI, PortMaster
  # and NXRedux packages and both libretro core sets (docs/RELEASING.md's Linux table).
  linux:
    name: Linux
    needs: publish
    if: always() && needs.publish.result == 'success'
    uses: ./.github/workflows/linux.yml
    with:
      ref: ${{ github.ref_name }}

  linux-attach:
    name: Linux zips onto the draft
    needs: linux
    if: always() && needs.linux.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pokedaisy-linux-*
          path: linux
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l linux/*/*.zip
          test "$(ls linux/*/*.zip | wc -l)" -eq 6 || { echo "::error::expected the six Linux zips"; exit 1; }
          gh release upload "${GITHUB_REF_NAME}" linux/*/*.zip --clobber -R "${GITHUB_REPOSITORY}"
