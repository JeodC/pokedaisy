# The release APK's build, one copy for the Release workflow (signed, with its keystore.properties written first) and
# the Nightly's dry run (unsigned): the submodules, the toolchain, the wrapper check, assembleRelease for arm64 and
# 32-bit ARM, and the check that both ABIs' libraries are inside. Run it after actions/checkout. It leaves the APK's
# path in the `apk` output. A change to how the release builds goes here, so the night tries it before a release does.
name: Release APK build
description: Build PokeDaisy's release APK (arm64 + armeabi-v7a) the way a release does

outputs:
  apk:
    description: The built APK (app-release.apk when signed, app-release-unsigned.apk otherwise)
    value: ${{ steps.check.outputs.apk }}

runs:
  using: composite
  steps:
    # The release APK builds without n3ds, as CI: keep the optional Azahar tree (and its unrelated Android wrappers,
    # which the wrapper validation doesn't know) out; the other submodules stay recursive. A recursive checkout of
    # every submodule failed 1.6.2-beta.2's first release run on Azahar's SDL copy.
    - name: Native dependencies (default features)
      shell: bash
      run: git -c submodule.third_party/azahar.update=none submodule update --init --recursive

    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: 17

    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      with:
        # Its default list includes the legacy "tools" package, which the SDK
        # repository no longer has (sdkmanager fails on it).
        packages: platform-tools
        log-accepted-android-sdk-licenses: false

    - name: NDK + CMake
      shell: bash
      run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

    # Azahar is left out above, so only the project's Gradle wrapper is there to check.
    - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      with:
        min-wrapper-count: 1

    - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      with:
        validate-wrappers: false

    # One APK for every device: arm64 and 32-bit ARM (a 32-bit Android, such as the Galaxy Tab A). The job's env carries
    # what app/build.gradle.kts reads from outside the repo (SCREENSCRAPER_DEV_*, COOP_RELAY_URL); none is needed.
    - name: Release APK
      shell: bash
      run: ./gradlew :app:assembleRelease -Ppokedaisy.armv7=true --stacktrace

    # A 32-bit device can't install an APK without armeabi-v7a, nor any device one missing the app's own library.
    - id: check
      name: Both ABIs inside
      shell: bash
      run: |
        dir=app/build/outputs/apk/release
        apk="${dir}/app-release.apk"
        [ -f "${apk}" ] || apk="${dir}/app-release-unsigned.apk"
        [ -f "${apk}" ] || { echo "::error::no release APK in ${dir}"; ls -la "${dir}" || true; exit 1; }
        files="$(unzip -Z1 "${apk}")"
        echo "ABIs: $(echo "${files}" | sed -n 's|^lib/\([^/]*\)/.*|\1|p' | sort -u | tr '\n' ' ')"
        for abi in arm64-v8a armeabi-v7a; do
          grep -qx "lib/${abi}/libpokedaisy.so" <<< "${files}" || { echo "::error::APK has no lib/${abi}/libpokedaisy.so"; exit 1; }
        done
        echo "apk=${apk}" >> "$GITHUB_OUTPUT"
